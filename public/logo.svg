<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Plain White Background -->
  <rect width="512" height="512" rx="100" fill="#FFFFFF"/>
  
  <!-- Subtle Back Note for Depth/Styling -->
  <g transform="rotate(-6 256 256)">
    <rect x="76" y="156" width="360" height="200" rx="16" fill="#FEE2E2" stroke="#DC2626" stroke-width="6" opacity="0.4"/>
  </g>

  <!-- Main Red Money Paper Note / Banknote in Middle -->
  <g transform="rotate(3 256 256)">
    <!-- Outer Banknote Body -->
    <rect x="76" y="156" width="360" height="200" rx="18" fill="#DC2626" stroke="#B91C1C" stroke-width="4"/>
    
    <!-- Banknote Inner Border Frame -->
    <rect x="92" y="172" width="328" height="168" rx="12" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="12,6"/>
    <rect x="100" y="180" width="312" height="152" rx="8" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Corner Decorative Elements -->
    <circle cx="120" cy="200" r="10" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="392" cy="200" r="10" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="120" cy="312" r="10" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="392" cy="312" r="10" fill="#FFFFFF" opacity="0.9"/>

    <!-- Left & Right Security Patterns -->
    <path d="M 140 220 Q 155 256 140 292" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>
    <path d="M 372 220 Q 357 256 372 292" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.7"/>

    <!-- Center Oval Frame -->
    <ellipse cx="256" cy="256" rx="68" ry="52" fill="#B91C1C" stroke="#FFFFFF" stroke-width="4"/>
    <ellipse cx="256" cy="256" rx="60" ry="44" fill="#DC2626" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="6,4"/>

    <!-- Money Currency Symbol / Emblem (Rs. / $) -->
    <text x="256" y="272" font-family="'Space Mono', 'Courier New', monospace, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Rs</text>
  </g>
</svg>
